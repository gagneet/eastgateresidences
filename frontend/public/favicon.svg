<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <!-- Background -->
    <rect width="64" height="64" fill="#2F4F4F" rx="12"/>

    <!-- Building silhouette -->
    <g fill="#F2CC8F">
        <!-- Main building -->
        <rect x="18" y="16" width="28" height="38" fill="#E07A5F"/>

        <!-- Windows - 3 rows of 3 -->
        <rect x="22" y="20" width="4" height="4" fill="#F2CC8F"/>
        <rect x="30" y="20" width="4" height="4" fill="#F2CC8F"/>
        <rect x="38" y="20" width="4" height="4" fill="#F2CC8F"/>

        <rect x="22" y="28" width="4" height="4" fill="#F2CC8F"/>
        <rect x="30" y="28" width="4" height="4" fill="#F2CC8F"/>
        <rect x="38" y="28" width="4" height="4" fill="#F2CC8F"/>

        <rect x="22" y="36" width="4" height="4" fill="#F2CC8F"/>
        <rect x="30" y="36" width="4" height="4" fill="#F2CC8F"/>
        <rect x="38" y="36" width="4" height="4" fill="#F2CC8F"/>

        <!-- Door -->
        <rect x="28" y="44" width="8" height="10" fill="#2F4F4F"/>

        <!-- Roof accent -->
        <polygon points="32,10 16,16 48,16" fill="#F2CC8F"/>

        <!-- E letter in the roof -->
        <text x="32" y="15" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#2F4F4F"
              text-anchor="middle">E
        </text>
    </g>
</svg>
