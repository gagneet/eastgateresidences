[pytest]
testpaths = tests
python_files = test_*.py
# tests/manual/diagnostics/archived_test_probes holds live-service diagnostics, not
# pytest suites — its own README asks for them to stay out of discovery. They were
# never actually excluded: targeting that path directly gives 5 collection errors
# (they import `database` and only resolve when tests/backend/conftest.py has already
# put backend/ on sys.path), and test_public_analytics.py is a FastAPI ROUTE HANDLER
# whose name happens to match test_*, so pytest collected and "passed" it by calling
# it with its Depends() defaults — a meaningless green result inside every full run.
norecursedirs = archived_test_probes *.egg .* _darcs build CVS dist node_modules venv {arch}
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
asyncio_mode = auto
# Share one event loop for the entire session so Motor's AsyncIOMotorClient
# (created at module-import time) stays bound to a live loop throughout all tests.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    integration: tests that require a running backend/API
