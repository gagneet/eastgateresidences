# Alembic configuration for StrataOS PostgreSQL financial core.
#
# Run from the backend/ directory:
#   DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
#   DATABASE_URL=postgresql+asyncpg://... alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# DATABASE_URL is injected from the environment variable in env.py.
# The placeholder below is intentionally left blank — do NOT put credentials here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
